# ============================================
# DataForge - Configuracion de Apache
# ============================================
# El directorio publico es el unico expuesto. El codigo, las plantillas y los
# registros se quedan fuera del alcance del navegador.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Nada fuera de public/ es accesible por HTTP.
    <DirectoryMatch "^/var/www/html/(src|config|templates|storage|tests|vendor|bin|database)">
        Require all denied
    </DirectoryMatch>

    # Los archivos ocultos y los que no son publicos tampoco.
    <FilesMatch "^\.|\.(env|ini|log|sql|md|dist|bak|sh|lock|neon|xml)$">
        Require all denied
    </FilesMatch>

    # Nunca se ejecuta PHP desde un archivo subido por el usuario.
    <DirectoryMatch "/storage/uploads">
        php_admin_flag engine off
        Require all denied
    </DirectoryMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always unset X-Powered-By
        Header always unset X-XSS-Protection
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
