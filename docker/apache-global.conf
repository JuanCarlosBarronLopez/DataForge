# ============================================
# DataForge - Configuracion global de Apache
# ============================================
# Evita el aviso "Could not reliably determine the server's fully qualified
# domain name" que Apache 2.4 emite en cada arranque cuando no hay ServerName.

ServerName localhost
ServerTokens Prod
ServerSignature Off

# El contenedor no expone la version de PHP.
<IfModule mod_headers.c>
    Header always unset X-Powered-By
</IfModule>
