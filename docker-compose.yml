# ============================================
# DataForge - Entorno de desarrollo con Docker
# ============================================
# Servicios: PHP/Apache + MySQL 8.4 + phpMyAdmin + Redis
#
# Uso:
#   docker compose up -d --build
#   App:        http://localhost:8080
#   phpMyAdmin: http://localhost:8081

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataforge-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-dataforge}
      DB_PASS: ${DB_PASS:-dataforge_secret}
      DB_CHARSET: utf8mb4
      SYSTEM_DB: ${SYSTEM_DB:-dataforge_system}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_NAME: ${APP_NAME:-DataForge}
      APP_VERSION: ${APP_VERSION:-4.0.0}
      APP_URL: http://localhost:${APP_PORT:-8080}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_STORAGE: ${RATE_LIMIT_STORAGE:-file}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-300}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-1800}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-28800}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dataforge-network

  db:
    image: mysql:8.4
    container_name: dataforge-db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${SYSTEM_DB:-dataforge_system}
      MYSQL_USER: ${DB_USER:-dataforge}
      MYSQL_PASSWORD: ${DB_PASS:-dataforge_secret}
    volumes:
      - dataforge-db-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dataforge-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dataforge-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 50M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dataforge-network

  redis:
    image: redis:8-alpine
    container_name: dataforge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - dataforge-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      - dataforge-network

volumes:
  dataforge-db-data:
    driver: local
  dataforge-redis-data:
    driver: local

networks:
  dataforge-network:
    driver: bridge
