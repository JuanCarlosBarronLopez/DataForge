# ============================================
# DataForge - Blueprint de Render
# ============================================
# Conecta el repositorio en Render -> New -> Blueprint.
# Documentacion: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: dataforge
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # ── Base de datos externa (TiDB Cloud, PlanetScale, Railway) ──
      # Alternativa a DB_HOST/DB_PORT/DB_USER/DB_PASS/SYSTEM_DB:
      # - key: MYSQL_URL
      #   sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_CHARSET
        value: "utf8mb4"
      - key: SYSTEM_DB
        value: "dataforge_system"

      # ── Aplicacion ──
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: "DataForge"
      - key: APP_VERSION
        value: "4.0.0"
      - key: APP_URL
        sync: false

      # ── Sesion ──
      - key: SESSION_IDLE_TIMEOUT
        value: "1800"
      - key: SESSION_ABSOLUTE_TIMEOUT
        value: "28800"

      # ── Rate limiting ──
      - key: RATE_LIMIT_STORAGE
        value: "file"
      - key: RATE_LIMIT_MAX
        value: "120"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: RATE_LIMIT_LOGIN_MAX
        value: "10"
      - key: RATE_LIMIT_LOGIN_WINDOW
        value: "300"

      # ── Proxies de confianza ──
      # Lista separada por comas con las IP o rangos CIDR que pueden
      # reenviar X-Forwarded-For. Vacia = no se confia en ningun proxy.
      - key: TRUSTED_PROXIES
        sync: false
